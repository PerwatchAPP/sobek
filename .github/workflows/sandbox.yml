name: Sandbox Hardening & Fuzz

on:
  push:
    branches: [main, feature/memory-limit]
  pull_request:

jobs:
  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify formatting and vet
        run: |
          diff -u <(echo -n) <(gofmt -d .)
          go vet ./...
      - name: Sandbox & memory limit tests (-race)
        run: >
          go test -race -v -run
          'TestMemoryLimit|TestStepLimit|TestExportJSON|TestPluginSandbox|TestCodeGen|TestNativeDepth|TestPromiseJobLimit|TestCompileSandbox|TestJSONParseAmplification|TestFreezeIntrinsics|TestInterruptHardening|TestMemoryCleanupOnLeave'
          .
      - name: Sandbox fuzz smoke (15s)
        run: go test -fuzz=FuzzSandbox -fuzztime=15s -run=^$ .
      - name: Plugin execution benchmarks
        run: go test -bench=BenchmarkPlugin -benchmem -run=^$ .
